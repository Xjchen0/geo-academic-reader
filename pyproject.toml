[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-academic-reader"
version = "0.0.1-pre"
description = "Scientific literature reader and VS Code rich-media Markdown generator for geosciences and general science."
readme = "README.md"
authors = [{ name = "geo-academic-reader contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["academic", "literature", "markdown", "vscode", "katex", "geoscience", "science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pypdf>=3.9.0",
    "websockets>=11.0",
]

[project.scripts]
geo-reader = "scripts.run_pipeline:main"
geo-doctor = "doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
