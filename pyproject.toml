[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-academic-reader"
version = "0.3.0-pre.1"
description = "Browser-first scientific literature evidence extractor and VS Code Markdown note workflow for geosciences and general science."
readme = "README.md"
authors = [{ name = "geo-academic-reader contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["academic", "literature", "markdown", "vscode", "katex", "geoscience", "science", "chrome", "cdp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pypdf>=3.9.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
figures = ["pymupdf>=1.23"]
dev = ["pytest>=7.0"]

[project.scripts]
geo-reader = "scripts.run_pipeline:main"
geo-doctor = "doctor:main"

[tool.setuptools]
py-modules = ["doctor"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
