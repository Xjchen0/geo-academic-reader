preset:
  name: geo-academic-reader
  version: "0.3.2"
  license: "MIT"
  description: "Browser-first evidence extraction and VS Code literature-note workflow for geosciences and general science. Scripts extract evidence; agents write notes."

compatibility:
  python: ">=3.9"
  os: ["darwin", "linux", "windows"]
  tools: ["python3", "requests", "beautifulsoup4", "pypdf", "websockets"]
  optional_tools: ["google-chrome", "chromium", "microsoft-edge", "pymupdf"]

network_policies:
  academic_sources:
    name: academic_sources
    endpoints:
      - host: api.crossref.org
        port: 443
        protocol: rest
      - host: api.openalex.org
        port: 443
        protocol: rest
      - host: doi.org
        port: 443
        protocol: rest
      - host: www.nature.com
        port: 443
        protocol: https
      - host: media.springernature.com
        port: 443
        protocol: https
      - host: www.science.org
        port: 443
        protocol: https
      - host: www.sciencedirect.com
        port: 443
        protocol: https
      - host: els-cdn.com
        port: 443
        protocol: https
      - host: agupubs.onlinelibrary.wiley.com
        port: 443
        protocol: https
      - host: www.biorxiv.org
        port: 443
        protocol: https
      - host: arxiv.org
        port: 443
        protocol: https
      - host: www.ncbi.nlm.nih.gov
        port: 443
        protocol: https
  local_browser:
    name: local_browser
    endpoints:
      - host: 127.0.0.1
        port: 9222
        protocol: http
  updates:
    name: updates
    description: "Optional update check; offline failure is ignored. Disable with GEO_READER_NO_UPDATE_CHECK=1."
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
      - host: github.com
        port: 443
        protocol: https
      - host: codeload.github.com
        port: 443
        protocol: https
